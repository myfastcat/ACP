<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CarryContext</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">CARRYCONTEXT</div>
      <h1>Move your AI work without starting over.</h1>
      <p class="lede">Paste a conversation. Get a compact context capsule you can carry into ChatGPT, Claude, Gemini, Codex, or any other AI.</p>
    </header>

    <section class="panel">
      <label for="source">Conversation or working notes</label>
      <textarea id="source" placeholder="Paste the conversation you want to continue elsewhere…"></textarea>
      <div class="actions">
        <button id="generate">Generate capsule</button>
        <span id="privacy">Runs locally in your browser.</span>
      </div>
    </section>

    <section class="panel output-panel">
      <div class="output-heading">
        <div>
          <div class="eyebrow">PORTABLE HANDOFF</div>
          <h2>Your Context Capsule</h2>
        </div>
        <button id="copy" class="secondary" disabled>Copy</button>
      </div>
      <textarea id="output" readonly placeholder="Your capsule will appear here…"></textarea>
      <div id="status" class="status">Nothing leaves this page.</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
