name: agent-incident-replay
on:
  push:
    paths: ['agent-incident-replay/**']
  pull_request:
    paths: ['agent-incident-replay/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest -e ./agent-incident-replay
      - run: pytest -q agent-incident-replay/tests
