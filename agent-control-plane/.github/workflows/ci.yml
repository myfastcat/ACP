name: ci
on:
  push:
    paths:
      - "agent-control-plane/**"
  pull_request:
    paths:
      - "agent-control-plane/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m agent_control_plane.cli validate examples/procurement-contract.json
      - name: Verify deny path returns 2
        run: |
          set +e
          python -m agent_control_plane.cli eval examples/procurement-contract.json examples/procurement-trace.json
          code=$?
          test "$code" -eq 2
