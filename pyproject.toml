[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-plane"
version = "0.2.0"
description = "Executable authority contracts for production AI agents"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "VCL"}]

[project.scripts]
acp = "agent_control_plane.cli:main"

[tool.setuptools.packages.find]
include = ["agent_control_plane*"]
