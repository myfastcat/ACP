name: air-ci

on:
  push:
    paths:
      - "agent-incident-replay/**"
      - ".github/workflows/air-ci.yml"
  pull_request:
    paths:
      - "agent-incident-replay/**"
      - ".github/workflows/air-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-incident-replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest -e .
      - run: pytest -q
      - name: Verify failing replay returns exit 2
        run: |
          cat > /tmp/fixture.json <<'JSON'
          {"schema":"air/v1","incident_id":"ci-deny","events":[{"seq":0,"action":"delete_database","context":{}}],"assertions":[{"type":"must_not_occur","action":"delete_database"}]}
          JSON
          set +e
          air replay /tmp/fixture.json
          code=$?
          test "$code" -eq 2
